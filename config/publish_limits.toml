# Limits for publish-static (B13). Cloudflare Pages Free allows 20,000 files per site and 25 MiB per
# file (developers.cloudflare.com/pages/platform/limits, checked 2026-11-15). The build stops well
# below both, so a world run fails loudly here rather than at upload.

[limits]
max_files = 18000
max_file_bytes = 1048576          # one city file: hard stop at 1 MiB (target is far smaller)
max_index_bytes = 2097152         # index.json: hard stop at 2 MiB (then it must be sharded by country)
max_other_bytes = 20971520        # attribution parts, attributions.json, manifest.json: hard stop at 20 MiB
attribution_part_bytes = 4194304  # attributions are split into parts of about this size
