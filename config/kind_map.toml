# Wikidata class (P31) -> place kind, for enrich-wikidata (B4). Global: nothing here is
# country-specific. A class that is not listed gives no kind (the place keeps its raw P31 values
# and the commonest unmapped classes are listed in kind_unmapped.csv). A place whose classes map
# to two different kinds gets no kind and a `kind_ambiguous` flag; nothing picks between them.
#
# First pass, from the India run on dump 20261101 (kind_unmapped.csv, the 110 commonest classes).
# Every Q-ID below is copied from that file, and its English label (the comment) is the label
# live Wikidata returned in that run. Classes that are not places visitors go to (railway
# stations, hotels, towns, districts, airports, hospitals, colleges, ...) are deliberately left
# out, and so are classes too broad to say anything (building, built structure, tower, lake,
# mountain, hill). Mapping a class is a judgement call: change one only with the reason.
#
# Allowed kinds: sight, museum, religious, fort_palace, park_nature, market, viewpoint,
# neighbourhood, activity. ("other" is what an unmapped place is.) No class from the India list
# was clearly a market, viewpoint or activity, so those have no entries yet.

