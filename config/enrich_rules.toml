# Rules for enrich-wikidata (B4). They decide what is flagged; nothing here fills or changes data
# by itself. How far a Wikidata point may be from a listing's page is not set here: it reuses the
# `far_km` limits of config/listing_quality.toml, so the two jobs cannot disagree about "far".
#
# Change a number only together with its reason, and bump rules_version. Nothing in the code is
# country-specific.

rules_version = 2

[coordinates.disagreement]
km = 25
reason = """When a place has both a Wikivoyage point and a Wikidata point, they are normally \
within a few hundred metres; further apart than this they are flagged \
`wikidata_coord_disagrees` for review. The Wikivoyage point is kept either way. Report-only: \
it never changes a coordinate. Measured on the world run (dump 20261101): of 59,844 listings \
that have both points, the median distance is 0 km, p95 1.2 km, p99 24.1 km, and 587 (1.0%) \
are above 25 km. Of 22,844 destinations, median 0.19 km, p95 6.2 km, p99 33.3 km, and 317 \
(1.4%) are above 25 km (a town's centre point is looser than a building's). The India run gave \
the same picture (29 listings, 0.8%, and 38 destinations, 3.5%, above 25 km). Checked against \
large countries: among countries with at least 200 such listings the highest shares above 25 km \
are NG 8.2% (244 listings), CN 4.6%, KR 3.9% and CA 3.6%, so 25 km is not too tight for big \
countries; the highest destination shares (GH, ET, CU, PK) are on 30 to 106 destinations each. \
Kept at 25 km: it flags about 1% for review and nothing more."""

[coordinates.max_precision]
degrees = 0.02
reason = """Wikidata stores how exactly a point is known (`precision`, in degrees). Up to an \
arcminute (0.0167 degrees, about 1.9 km) is treated as a place's point; anything coarser \
(0.1 or 1 degree, 11 to 111 km) describes an area, not a place, so it is never used to fill a \
missing coordinate and the row says `wikidata_coord_coarse`. Inclusive: exactly 0.02 is allowed. \
A point with no stated precision is allowed. Set from Wikidata's own precision scale, not yet \
from the data: the India and world runs' flag counts are the check."""
