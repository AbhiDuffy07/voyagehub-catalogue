# Rules for wikipedia-summary (B4b). They only decide what is flagged; no text is dropped,
# rewritten or shortened because of them.
#
# Change a number only together with its reason, and bump rules_version. Nothing in the code is
# country-specific.

rules_version = 1

[summary.very_short]
chars = 80
reason = """A lead shorter than this is a stub or a one-line definition ("X is a village in \
Y."), too thin to show as an overview. It is flagged `very_short` and kept; a later step decides \
what to show. PROVISIONAL: set before any real run, to be checked against the lead lengths of \
the India run's report."""
