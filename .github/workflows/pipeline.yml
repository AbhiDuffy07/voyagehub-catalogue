name: pipeline

# Manual run of the whole catalogue pipeline for one country (India first), optionally followed by
# a deploy to Cloudflare Pages. Runs only when the owner starts it; there is no schedule here.
#
# The job uses the `production` environment, which holds the secrets and is restricted to the main
# branch, so a workflow edited on another branch cannot read them. This repo is public: the logs
# show only counts and PipelineError messages, so never add `set -x`, `env`, or an echo of a secret.
# Secrets are passed only as step-level environment variables, never written into a command line.
on:
  workflow_dispatch:
    inputs:
      dump_date:
        description: "Wikivoyage dump date, eight digits, still online at dumps.wikimedia.org"
        required: true
        type: string
      country:
        description: "ISO country code"
        required: true
        default: "IN"
        type: string
      deploy:
        description: "Deploy to Cloudflare Pages when the build succeeds (off = build only)"
        required: true
        default: false
        type: boolean
      pages_branch:
        description: "Pages branch: main is production, any other name is a preview"
        required: true
        default: "main"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  DUMP_DATE: ${{ inputs.dump_date }}
  COUNTRY: ${{ inputs.country }}
  PAGES_BRANCH: ${{ inputs.pages_branch }}
  PYTHONUNBUFFERED: "1"

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    # A full India run is expected to take about 2 hours (see README); the hard limit is 6.
    timeout-minutes: 345
    environment: production
    steps:
      - name: Check the inputs
        run: |
          [[ "$DUMP_DATE" =~ ^[0-9]{8}$ ]] || { echo "dump_date must be eight digits"; exit 1; }
          [[ "$COUNTRY" =~ ^[A-Z]{2}$ ]] || { echo "country must be two capital letters"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Discover (world folder; downloads and verifies the dump)
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python -m catalogue discover --dump-date "$DUMP_DATE"

      - name: The slug registry must not change in a pipeline run
        run: |
          git diff --exit-code --quiet -- data/ \
            || { echo "data/slugs.json changed; slugs are assigned only in a reviewed PR"; exit 1; }

      - name: Fetch listings
        run: python -m catalogue fetch-listings --dump-date "$DUMP_DATE" --country "$COUNTRY"

      - name: Enrich with Wikidata
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python -m catalogue enrich-wikidata --dump-date "$DUMP_DATE" --country "$COUNTRY"

      - name: Wikipedia summaries
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python -m catalogue wikipedia-summary --dump-date "$DUMP_DATE" --country "$COUNTRY"

      - name: Photo candidates
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python -m catalogue photo-candidates --dump-date "$DUMP_DATE" --country "$COUNTRY"

      - name: Select photos, time zones, blocks, checks and prices (offline)
        run: |
          python -m catalogue photo-select --dump-date "$DUMP_DATE" --country "$COUNTRY"
          python -m catalogue derive-timezone --dump-date "$DUMP_DATE" --country "$COUNTRY"
          python -m catalogue draft-blocks --dump-date "$DUMP_DATE" --country "$COUNTRY"
          python -m catalogue auto-check --dump-date "$DUMP_DATE" --country "$COUNTRY"
          python -m catalogue price-bands --dump-date "$DUMP_DATE" --country "$COUNTRY"

      # The state file lives in the `readiness-state-<CC>` artifact of the latest production run. Without
      # one (first run, or older than the 90-day retention) every city counts as a first failure,
      # which never unpublishes anything: the safe direction. The artifact is per country, and only
      # production deploys save one, so a preview can never become the "previous" state.
      - name: Fetch the previous readiness state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-state
          # A failing listing stops the step (it must not look like a first run).
          run_ids=$(gh run list --workflow pipeline.yml --status success --limit 20             --json databaseId --jq '.[].databaseId')
          for run_id in $run_ids; do
            if gh run download "$run_id" --name "readiness-state-$COUNTRY" --dir previous-state                 2> /dev/null; then
              echo "previous readiness state: found"
              exit 0
            fi
          done
          echo "previous readiness state: none found, starting without one"

      - name: Readiness, then build the static site (offline)
        run: |
          previous=()
          if [ -f previous-state/state.json ]; then previous=(--previous previous-state); fi
          python -m catalogue readiness --dump-date "$DUMP_DATE" --country "$COUNTRY" "${previous[@]}"
          python -m catalogue publish-static --dump-date "$DUMP_DATE" --country "$COUNTRY"

      - name: Deploy to Cloudflare Pages
        if: inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          python -m catalogue deploy
          --site-dir "out/publish/${DUMP_DATE}-${COUNTRY}/site"
          --branch "$PAGES_BRANCH" --yes

      # Only after a successful production deploy, so the saved state matches what is live.
      - name: Save the readiness state
        if: inputs.deploy && inputs.pages_branch == 'main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-state-${{ inputs.country }}
          path: out/readiness/${{ inputs.dump_date }}-${{ inputs.country }}/state.json
          retention-days: 90
          if-no-files-found: error
