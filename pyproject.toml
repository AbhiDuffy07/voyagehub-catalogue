[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["smoke: needs the real database or network; run with RUN_SMOKE=1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]  # S105: fake secrets in tests
